[server]
port = 3000
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false
disconnectedSessionTTL = 86400
fileWatcherType = "none"
maxUploadSize = 50
maxMessageSize = 50

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"

